name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force bump kind"
        type: choice
        options: [major]

jobs:
  release:
    # Moving ref: bumping app-release.yml in aw-marketplace propagates here
    # automatically. Move to @v1 once aw-marketplace cuts a first tag.
    uses: tekflox/aw-marketplace/.github/workflows/app-release.yml@main
    with:
      bump: ${{ inputs.bump || '' }}
    secrets: inherit
